<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aster & Row Support Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        #chat {
            height: 450px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }

        .message {
            margin: 12px 0;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #e8f0fe;
            text-align: right;
        }

        .assistant {
            background: #eeeeee;
        }

        .sources {
            background: #f7f7f7;
            color: #555;
            font-size: 14px;
            border-left: 3px solid #777;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #444;
        }

        .clear-button {
            margin-top: 10px;
            background: #777;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Aster & Row Support Agent</h1>

    <div class="subtitle">
        AI-powered customer support assistant
    </div>


    <div id="chat">

        <div class="message assistant">
            Hello! How can I help you today?
        </div>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Ask a question..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>


    <button
        class="clear-button"
        onclick="clearChat()"
    >
        Clear Chat
    </button>

</div>


<script>

    const input =
        document.getElementById("message");

    const chat =
        document.getElementById("chat");


    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


    async function sendMessage() {

        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        // Show user message

        const userMessage =
            document.createElement("div");

        userMessage.className =
            "message user";

        userMessage.textContent =
            message;

        chat.appendChild(
            userMessage
        );


        input.value = "";

        chat.scrollTop =
            chat.scrollHeight;


        // Loading message

        const loading =
            document.createElement("div");

        loading.className =
            "message assistant";

        loading.textContent =
            "Thinking...";

        chat.appendChild(
            loading
        );


        try {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );


            const data =
                await response.json();


            loading.remove();


            // Assistant response

            const assistantMessage =
                document.createElement("div");

            assistantMessage.className =
                "message assistant";

            assistantMessage.textContent =
                data.response;

            chat.appendChild(
                assistantMessage
            );


            // Sources

            if (
                data.sources &&
                data.sources.length > 0
            ) {

                const sourceMessage =
                    document.createElement("div");

                sourceMessage.className =
                    "message sources";

                sourceMessage.textContent =
                    "Sources: " +
                    data.sources.join(", ");

                chat.appendChild(
                    sourceMessage
                );

            }

        }

        catch (error) {

            loading.textContent =
                "Something went wrong.";

            console.error(error);

        }


        chat.scrollTop =
            chat.scrollHeight;
    }


    function clearChat() {

        chat.innerHTML = "";

        const message =
            document.createElement("div");

        message.className =
            "message assistant";

        message.textContent =
            "Hello! How can I help you today?";

        chat.appendChild(
            message
        );

    }

</script>

</body>

</html>
